<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071714"><title>DEEPAM — The Living Light</title><meta name="description" content="A living Diwali light experience. Touch the flame and share the light."><style>*{box-sizing:border-box}body{margin:0;background:#061512;color:#ead5a5;font-family:Georgia,serif;overflow:hidden}canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:manipulation}header{position:fixed;top:24px;left:24px;right:24px;display:flex;justify-content:space-between;align-items:center;z-index:2;letter-spacing:.25em;font-size:13px}header span{font:10px system-ui;letter-spacing:.2em;color:#a89468}.center{position:fixed;top:12%;left:0;right:0;text-align:center;pointer-events:none}h1{font-weight:normal;letter-spacing:.25em;font-size:clamp(35px,7vw,76px);margin:0;color:#f4d58e;text-shadow:0 0 30px #bc7e3655}.center p{font:12px system-ui;letter-spacing:.35em;color:#c1aa7d}.bottom{position:fixed;bottom:22px;left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}.hint{font:13px system-ui;color:#cdbb96;letter-spacing:.07em}button{background:#0b231dc9;color:#f1d397;border:1px solid #a8844c88;border-radius:30px;padding:11px 18px;cursor:pointer;letter-spacing:.08em}button:hover{background:#1c382d}.buttons{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}.credit{font:10px system-ui;letter-spacing:.2em;color:#907d5d}#toast{min-height:18px;font:12px system-ui;color:#e9cb89}@media(max-height:600px){.center{top:9%}.bottom{bottom:8px;gap:6px}h1{font-size:35px}}@media(prefers-reduced-motion:reduce){canvas{opacity:.85}}</style></head><body><canvas id="scene" aria-label="Interactive golden diya and geometric light visualization"></canvas><header><div>✦ DEEPAM</div><span>A VER CREATION</span></header><div class="center"><h1>THE LIVING LIGHT</h1><p>ONE FLAME · INFINITE POSSIBILITIES</p></div><div class="bottom"><div class="hint" id="hint">Tap anywhere to awaken the light ✨</div><div class="buttons"><button id="ignite">✦ Illuminate</button><button id="sound">♫ Sound off</button><button id="share">↗ Share the light</button></div><div id="toast" role="status"></div><div class="credit">CRAFTED WITH LIGHT · HAPPY DIWALI</div></div><script>
const c=document.querySelector('canvas'),x=c.getContext('2d');let w,h,dpr,t=0,energy=.15,bursts=[],audio=null,osc=null,gain=null,sound=false;const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;function resize(){dpr=Math.min(devicePixelRatio||1,2);w=innerWidth;h=innerHeight;c.width=w*dpr;c.height=h*dpr;x.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();function line(points,alpha=.5,width=1){x.beginPath();points.forEach(([a,b],i)=>i?x.lineTo(a,b):x.moveTo(a,b));x.strokeStyle=`rgba(239,190,98,${alpha})`;x.lineWidth=width;x.stroke()}function glow(cx,cy,r){let g=x.createRadialGradient(cx,cy,0,cx,cy,r);g.addColorStop(0,'#ffbd4e60');g.addColorStop(.3,'#b8752424');g.addColorStop(1,'#00000000');x.fillStyle=g;x.beginPath();x.arc(cx,cy,r,0,7);x.fill()}function render(){t+=reduced?.002:.012;energy*=.998;let cx=w/2,cy=h*.53,s=Math.min(w,h)*.33;x.clearRect(0,0,w,h);let bg=x.createRadialGradient(cx,cy,0,cx,cy,Math.max(w,h)*.75);bg.addColorStop(0,'#123128');bg.addColorStop(.5,'#081b17');bg.addColorStop(1,'#020b09');x.fillStyle=bg;x.fillRect(0,0,w,h);glow(cx,cy,s*(1.2+energy));let rings=7;for(let j=0;j<rings;j++){let r=s*(.48+j*.15);x.beginPath();x.arc(cx,cy,r,0,Math.PI*2);x.strokeStyle=`rgba(222,171,80,${.08+energy*.12})`;x.lineWidth=.7;x.stroke();let n=12+j*6,phase=t*(j%2?1:-1)*(.08+energy*.13);let pts=[];for(let k=0;k<n;k++){let a=k*Math.PI*2/n+phase;pts.push([cx+Math.cos(a)*r,cy+Math.sin(a)*r])}line([...pts,pts[0]],.09+energy*.24,.8);for(let k=0;k<n;k++){let a=k*Math.PI*2/n+phase;x.fillStyle=`rgba(255,205,120,${.2+energy*.4})`;x.beginPath();x.arc(cx+Math.cos(a)*r,cy+Math.sin(a)*r,1.15,0,7);x.fill()}}for(let j=0;j<8;j++){let a=j*Math.PI/4+t*.04,r=s*.72;line([[cx+Math.cos(a)*r,cy+Math.sin(a)*r],[cx+Math.cos(a+Math.PI)*r,cy+Math.sin(a+Math.PI)]],.08+energy*.13)}let fy=cy+s*.03;glow(cx,fy-25,s*.44);x.save();x.translate(cx,fy);x.fillStyle='#8d5224';x.strokeStyle='#f7c46e';x.lineWidth=2;x.beginPath();x.moveTo(-s*.27,5);x.quadraticCurveTo(0,s*.28,s*.27,5);x.quadraticCurveTo(0,s*.09,-s*.27,5);x.fill();x.stroke();x.beginPath();x.ellipse(0,5,s*.27,s*.048,0,0,7);x.fillStyle='#e6a24a';x.fill();x.stroke();let flick=Math.sin(t*6)*3;x.beginPath();x.moveTo(0,5);x.bezierCurveTo(-s*.12,-s*.18, -s*.045+flick,-s*.33, 0,-s*.42);x.bezierCurveTo(s*.09,-s*.27,s*.1,-s*.12,0,5);x.fillStyle='#ffb342';x.shadowColor='#ffac3e';x.shadowBlur=25;x.fill();x.beginPath();x.moveTo(0,0);x.quadraticCurveTo(-s*.035,-s*.15,0,-s*.29);x.quadraticCurveTo(s*.045,-s*.12,0,0);x.fillStyle='#fff1bd';x.fill();x.restore();bursts=bursts.filter(b=>b.life>0);for(const b of bursts){b.r+=2.5;b.life-=.008;x.beginPath();x.arc(b.x,b.y,b.r,0,7);x.strokeStyle=`rgba(255,203,111,${b.life*.5})`;x.lineWidth=1.5;x.stroke()}requestAnimationFrame(render)}render();function ignite(e){energy=Math.min(2,energy+.48);bursts.push({x:e?.clientX||w/2,y:e?.clientY||h*.53,r:10,life:1});document.querySelector('#hint').textContent=energy>.8?'May your light illuminate the world ✨':'Every light begins with a spark ✨';if(sound&&audio){let o=audio.createOscillator(),g=audio.createGain();o.type='sine';o.frequency.setValueAtTime(660,audio.currentTime);o.frequency.exponentialRampToValueAtTime(440,audio.currentTime+.5);g.gain.setValueAtTime(.0001,audio.currentTime);g.gain.exponentialRampToValueAtTime(.06,audio.currentTime+.02);g.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+1.2);o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+1.2)}}c.addEventListener('pointerdown',ignite);document.querySelector('#ignite').onclick=()=>ignite();document.querySelector('#sound').onclick=async()=>{sound=!sound;if(sound){audio ||=new (window.AudioContext||window.webkitAudioContext)();await audio.resume()}document.querySelector('#sound').textContent=sound?'♫ Sound on':'♫ Sound off'};document.querySelector('#share').onclick=async()=>{let data={title:'DEEPAM — The Living Light',text:'May your Diwali shine with infinite light 🪔',url:location.href};try{if(navigator.share)await navigator.share(data);else{await navigator.clipboard.writeText(data.url);document.querySelector('#toast').textContent='Link copied — share the light!'}}catch(e){if(e.name!=='AbortError')document.querySelector('#toast').textContent='Share this page URL with a friend.'}};
</script></body></html>
